<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Hermes CEO Console Setup</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff7fb;color:#2d2430;margin:0;display:grid;place-items:center;min-height:100vh}.card{width:min(760px,90vw);background:white;border:1px solid #f0cfe0;border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(150,80,120,.18)}h1{margin-top:0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button{border:0;border-radius:12px;padding:12px 16px;background:#d85b9f;color:white;font-weight:700;cursor:pointer}button.secondary{background:#f5e4ee;color:#5c4050}.status{margin-top:18px;padding:12px;border-radius:12px;background:#fff2f8;white-space:pre-wrap}code{background:#f7edf3;padding:2px 6px;border-radius:6px}</style></head><body><main class="card"><h1>Hermes CEO Console Setup</h1><p>WebUI가 아직 <code>localhost:8788</code>에서 실행 중이 아닙니다. 설치/설정 마법사를 실행하거나, 이미 설치했다면 재시도하세요.</p><ul><li>Hermes Agent 설치/업데이트</li><li>Hermes WebUI 설치/업데이트</li><li>Telegram / Paperclip / Codex 설정 안내</li><li>비밀값은 로컬에만 저장</li></ul><div class="actions"><button id="setup">Run Setup Wizard</button><button class="secondary" id="retry">Retry</button><button class="secondary" id="logs">Open Logs</button><button class="secondary" id="browser">Open Browser</button></div><div class="status" id="status">Ready.</div></main><script src="setup.js"></script></body></html>
