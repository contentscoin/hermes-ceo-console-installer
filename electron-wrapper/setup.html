<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Hermes CEO Console Setup</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff7fb;color:#2d2430;margin:0;display:grid;place-items:center;min-height:100vh}.card{width:min(780px,90vw);background:white;border:1px solid #f0cfe0;border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(150,80,120,.18)}h1{margin-top:0}.lead{line-height:1.55;color:#5c4050}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button{border:0;border-radius:12px;padding:12px 16px;background:#d85b9f;color:white;font-weight:700;cursor:pointer}button.secondary{background:#f5e4ee;color:#5c4050}.status{margin-top:18px;padding:12px;border-radius:12px;background:#fff2f8;white-space:pre-wrap;line-height:1.45}code{background:#f7edf3;padding:2px 6px;border-radius:6px}.hidden{display:none}.muted{color:#806878;font-size:13px;margin-top:16px}</style></head><body><main class="card"><h1 id="title">Hermes CEO Console</h1><p class="lead" id="lead">상태를 확인하는 중입니다.</p><ul id="checklist"><li>기존 세팅이 있으면 WebUI를 자동으로 시작하고 앱을 엽니다.</li><li>처음 설치하는 사용자는 터미널 기반 Setup Wizard를 진행합니다.</li><li>Telegram / Paperclip / Codex / 모델 키는 사용자가 직접 입력합니다.</li><li>비밀값은 로컬에만 저장됩니다.</li></ul><div class="actions"><button id="setup">처음 설치 / Setup Wizard</button><button id="start" class="secondary">기존 세팅으로 앱 시작</button><button class="secondary" id="retry">다시 확인</button><button class="secondary" id="logs">로그 열기</button><button class="secondary" id="browser">브라우저 열기</button><button class="secondary" id="updates">업데이트 확인</button><button id="restart">서버 재시작/복구</button></div><div class="status" id="status">Ready.</div><p class="muted" id="meta"></p></main><script src="setup.js"></script></body></html>
